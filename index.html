<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>island-builder</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="hud">
      <div><b>Left click</b> add block (on water: ground level, on a face: extrude from that face)</div>
      <div><b>Right click</b> remove block</div>
      <div><b>Left drag</b> pan · <b>Right drag</b> rotate · <b>Wheel</b> zoom</div>
      <div id="stats"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
